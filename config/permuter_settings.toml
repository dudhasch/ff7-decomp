build_system = "ninja"
compiler_type = "gcc"

# decomp-permuter's bundled prelude is N64-flavoured and opens with `.set gp=64`,
# which mipsel-linux-gnu-as rejects on this project's 32-bit R3000A target.
# The assembler itself cannot be corrected here -- import.py forbids combining
# `assembler_command` with `build_system` -- so it is overridden by putting
# tools/permuter-bin on PATH instead. See CLAUDE.md step 4.
asm_prelude_file = "config/permuter_prelude.inc"

# Likewise, the scorer's objdump defaults to a big-endian MIPS/N64 search list
# (mips-linux-gnu-objdump, mips64-linux-gnu-objdump, mips64-elf-objdump), none
# of which exist here. Unlike the assembler, this one has a supported override
# that import.py copies into the generated scratch settings.toml.
# Supplying this replaces the default argument list outright, so the scorer's
# own flags have to be repeated: -drz, and -m with the R3000A arch in place of
# the N64 default of mips:4300.
objdump_command = "mipsel-linux-gnu-objdump -drz -m mips:3000"

# Macros import.py leaves unexpanded in base.c, declaring each as an opaque
# function of the type given here so pycparser can still type-check the file.
# The real #define is restored in a late-define block before every candidate is
# compiled, so preserving one never changes codegen -- it only keeps the
# permuter from mutating the macro's guts, and keeps a winning candidate
# copy-pasteable straight back into src/.
#
# These types must be built-in: the generated declarations are emitted above
# the typedefs, so `u8` and friends are not in scope yet.
#
# Preserve only macros whose internal shape is never the matching lever. If a
# diff turns out to be *inside* one of these, re-import that function with
# `import.py --preserve-macros ''` to expand everything.
#
# (The previous entries here -- gSP*, gDma*, _SHIFTL -- were N64 GBI macros
# carried over from decomp-permuter's example settings. No FF7 source file
# mentions any of them.)
[preserve_macros]
# src/field/field.c: the field script VM. 190 PC_INC and 201 GET_PARAM_U8 sites.
"PC_INC|PC_DEC" = "void"
"GET_PARAM_U8" = "unsigned char"
"GET_PRIORITY|GET_SCRIPTID" = "int"
"ADD_PARTY_MEMBER" = "void"
# src/battle/battle2.c fixed-point multiply, src/world/world.h, include/common.h.
"MUL" = "int"
"ABS" = "int"
# The PSY-Q GTE intrinsics expand to `__asm__ volatile`, which pycparser
# cannot parse -- and a syntax error anywhere in base.c makes import.py skip
# the prune, so every function in the unit is compiled into every candidate
# (CLAUDE.md, "Stripping is not enough on its own"). All of them are
# statement macros, so `void` is the honest declaration.
"gte_[a-z0-9_]+" = "void"
"LEN" = "int"
# Deliberately *not* preserved: GET_PARAM_S16, READ_S8 and READ_S16 all write
# through an argument. Hidden behind an opaque `void f()` the randomizer stops
# seeing those writes and starts producing candidates that drop the variable.
#
# _S() cannot be listed at all: under -DFF7_STR it is not a macro, it is
# rewritten textually by bin/str after cpp (see include/game.h).
